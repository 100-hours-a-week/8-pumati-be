version: '3.8'

services:
  kafka-1:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-8.0.0} # Kafka 4.0
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "${KAFKA_1_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-29093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-29093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-29093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://kafka-1:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://0.0.0.0:${KAFKA_1_EXTERNAL_PORT:-9092},CONTROLLER://kafka-1:${KAFKA_CONTROLLER_PORT:-29093}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_1_EXTERNAL_PORT:-9092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR:-2}

      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"

    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks: [kafka-net]

  kafka-2:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-8.0.0}
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "${KAFKA_2_EXTERNAL_PORT:-9192}:9192"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-29093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-29093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-29093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://kafka-2:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://0.0.0.0:${KAFKA_2_EXTERNAL_PORT:-9192},CONTROLLER://kafka-2:${KAFKA_CONTROLLER_PORT:-29093}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_2_EXTERNAL_PORT:-9192}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR:-2}

      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"

    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks: [kafka-net]

  kafka-3:
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-8.0.0}
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "${KAFKA_3_EXTERNAL_PORT:-9292}:9292"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-29093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-29093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-29093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://kafka-3:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://0.0.0.0:${KAFKA_3_EXTERNAL_PORT:-9292},CONTROLLER://kafka-3:${KAFKA_CONTROLLER_PORT:-29093}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_3_EXTERNAL_PORT:-9292}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR:-2}

      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"

    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks: [kafka-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-3n
      # 내부 네트워크 부트스트랩
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks: [kafka-net]

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:

networks:
  kafka-net:
